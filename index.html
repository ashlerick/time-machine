<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Time Machine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🕰️ Time Machine</h1>
  <p>Send your photo back in time.</p>

  <form id="uploadForm">
    <input type="file" id="imageInput" accept="image/*" required />
    <button type="submit">Send to the Past</button>
  </form>

  <h2>Result</h2>
  <img id="result" />

  <script src="script.js"></script>
</body>
</html>
